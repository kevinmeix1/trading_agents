[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-agents"
version = "0.1.0"
description = "Multi-agent AI system for financial trading with hierarchical orchestration"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    "numpy>=1.26",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
llm = [
    "openai>=1.30",
    "anthropic>=0.28",
]
langgraph = [
    "langgraph>=0.2",
    "langchain-core>=0.2",
]

[project.scripts]
trading-agents = "trading_agents.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/trading_agents"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
