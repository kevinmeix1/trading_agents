[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-agents"
version = "0.1.0"
description = "An advanced multi-agent AI system for financial trading research and simulation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "trading_agents contributors" }]
keywords = ["ai", "agents", "llm", "trading", "finance", "backtesting", "multi-agent"]

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "rich>=13.0",
    "typer>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Live market data
data = ["yfinance>=0.2.40"]
# LLM providers (only needed when not running in offline/heuristic mode)
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.34"]
# Everything
all = ["yfinance>=0.2.40", "openai>=1.30", "anthropic>=0.34"]
# Development
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
trading-agents = "trading_agents.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["trading_agents*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API uses function calls in argument defaults.
"trading_agents/cli.py" = ["B008"]
