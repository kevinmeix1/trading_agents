[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-trading-agent"
version = "0.1.0"
description = "Stock Trading Agent — a multi-agent AI desk that analyses a stock, debates the bull/bear case, sizes the position under a risk mandate, and backtests the decision. Runs offline and deterministically; a web dashboard and REST API are included."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Stock Trading Agent contributors" }]
keywords = [
    "ai", "agents", "llm", "stock-trading", "quantitative-finance",
    "backtesting", "multi-agent", "portfolio", "risk-management", "fastapi",
]

dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "numpy>=1.24",
    "pandas>=2.0",
    "rich>=13.0",
    "typer>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Live market data
data = ["yfinance>=0.2.40"]
# LLM providers (only needed when not running in offline/heuristic mode)
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.34"]
# Web dashboard + REST API
web = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
# Architecture documentation / PDF generation
docs = ["reportlab>=4.0"]
# Everything
all = [
    "yfinance>=0.2.40",
    "openai>=1.30",
    "anthropic>=0.34",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "reportlab>=4.0",
]
# Development
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.4", "mypy>=1.8", "httpx>=0.27"]

[project.scripts]
stock-trading-agent = "stock_trading_agent.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["stock_trading_agent*"]

[tool.setuptools.package-data]
"stock_trading_agent" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer's idiomatic API uses function calls in argument defaults.
"stock_trading_agent/cli.py" = ["B008"]
