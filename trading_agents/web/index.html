<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>trading_agents — multi-agent AI trading desk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  </head>
  <body>
    <div class="aurora"></div>
    <header class="topbar">
      <div class="brand">
        <div class="logo">◈</div>
        <div>
          <h1>trading<span>_agents</span></h1>
          <p class="tagline">Multi-agent AI trading research desk</p>
        </div>
      </div>
      <div class="status" id="status-pills">
        <span class="pill pill-muted" id="pill-version">v—</span>
        <span class="pill" id="pill-mode">offline</span>
        <span class="pill pill-muted" id="pill-data">synthetic</span>
      </div>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="analyze">Analyze</button>
      <button class="tab" data-tab="backtest">Backtest</button>
      <a class="tab tab-link" href="/docs" target="_blank" rel="noopener">API ↗</a>
    </nav>

    <main>
      <!-- ANALYZE -->
      <section class="panel active" id="tab-analyze">
        <form class="controls card" id="analyze-form">
          <div class="field">
            <label>Symbol</label>
            <input id="a-symbol" value="AAPL" autocomplete="off" />
          </div>
          <div class="field">
            <label>Lookback (days)</label>
            <input id="a-days" type="number" value="365" min="60" max="2000" />
          </div>
          <div class="field">
            <label>Debate rounds</label>
            <input id="a-rounds" type="number" value="2" min="1" max="5" />
          </div>
          <div class="field grow">
            <label>Headlines (one per line, optional)</label>
            <textarea id="a-news" rows="1" placeholder="Beats earnings with record growth"></textarea>
          </div>
          <button class="btn primary" type="submit" id="a-run">Run analysis</button>
        </form>

        <div id="analyze-results" class="results hidden">
          <div class="decision-card card" id="decision-card"></div>

          <div class="grid-2">
            <div class="card">
              <h3 class="card-title">Analyst reports</h3>
              <div id="reports"></div>
            </div>
            <div class="card">
              <h3 class="card-title">Research debate</h3>
              <div id="debate"></div>
            </div>
          </div>

          <div class="grid-2">
            <div class="card">
              <h3 class="card-title">Risk mandate</h3>
              <div id="risk"></div>
            </div>
            <div class="card">
              <h3 class="card-title">Technical snapshot</h3>
              <div id="indicators" class="indi-grid"></div>
            </div>
          </div>
        </div>
      </section>

      <!-- BACKTEST -->
      <section class="panel" id="tab-backtest">
        <form class="controls card" id="backtest-form">
          <div class="field">
            <label>Symbol</label>
            <input id="b-symbol" value="MSFT" autocomplete="off" />
          </div>
          <div class="field">
            <label>History (days)</label>
            <input id="b-days" type="number" value="600" min="120" max="3000" />
          </div>
          <div class="field">
            <label>Rebalance (days)</label>
            <input id="b-rebal" type="number" value="21" min="1" max="120" />
          </div>
          <div class="field grow">
            <label>Strategies</label>
            <div id="strategy-chips" class="chips"></div>
          </div>
          <button class="btn primary" type="submit" id="b-run">Run backtest</button>
        </form>

        <div id="backtest-results" class="results hidden">
          <div class="card">
            <h3 class="card-title">Equity curves <span class="muted">(start = $100,000)</span></h3>
            <div class="chart-wrap"><canvas id="equity-chart"></canvas></div>
          </div>
          <div class="card">
            <h3 class="card-title">Performance metrics</h3>
            <div class="table-wrap"><table id="metrics-table"></table></div>
          </div>
        </div>
      </section>
    </main>

    <div class="toast hidden" id="toast"></div>
    <footer>
      <span>Educational / research only — not investment advice. Runs deterministically offline.</span>
    </footer>

    <script src="/app.js"></script>
  </body>
</html>
